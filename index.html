<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>منو</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    display:grid; place-items:center; padding:24px;
    background:#1a0f0a; color:#fff;
    font-family:Tahoma,sans-serif; text-align:center;
  }
  .card{
    width:100%; max-width:420px; padding:32px 24px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(254,123,1,.3);
    border-radius:20px;
  }
  h1{font-size:20px; margin:8px 0; color:#ffd9b4}
  .sub{font-size:13px; color:#a09080; margin:0 0 20px}
  .spin{
    width:36px; height:36px; margin:0 auto 14px;
    border:4px solid rgba(255,255,255,.15);
    border-top-color:#fe7b01; border-radius:50%;
    animation:r 1s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg)}}
  #status{font-size:14px; margin:0 0 16px}
  #links{display:none}
  #links p{font-size:12px; color:#a09080; margin:16px 0 8px}
  #links a{
    display:block; padding:14px; margin:8px 0;
    color:#ffd9b4; text-decoration:none; font-size:15px;
    border:1px solid rgba(254,123,1,.4);
    border-radius:12px; background:rgba(254,123,1,.08);
  }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:38px"></div>
  <h1 id="cafeName"></h1>
  <p class="sub">در حال پیدا کردن بهترین مسیر...</p>
  <div class="spin" id="spin"></div>
  <p id="status">لطفاً صبر کن</p>

  <div id="links">
    <p>اگر خودکار باز نشد، اپراتورت رو انتخاب کن:</p>
  </div>
</div>

<script>
/* =====================================================
   ✏️ فقط این قسمت رو تغییر بده
   ===================================================== */

// اسم کافه (بالای صفحه نشون داده میشه)
var CAFE_NAME = "";

// لینک‌ها: هر خط یک سایت
var SITES = [
  { name: "همراه اول", url: "https://www.menuc1.ir" },
  { name: "ایرانسل",   url: "https://menuc1.ir" }
];

// مسیر سبک برای تست سرعت (اگه توی ورکر نساختی، "/" بذار)
var PING_PATH = "/ping";

// حداکثر زمان انتظار برای تست (میلی‌ثانیه)
var TIMEOUT = 6000;

// سایت برنده چند دقیقه یادش بمونه (۰ = خاموش)
var CACHE_MINUTES = 10;

// تست سایت ذخیره‌شده چقدر صبر کنه، بعدش دوباره مسابقه (میلی‌ثانیه)
var CACHE_TIMEOUT = 2000;

// بعد از چند ثانیه دکمه‌های دستی نشون داده بشه
var SHOW_MANUAL_AFTER = 4000;

/* =====================================================
   ⛔ از اینجا به پایین نیازی به تغییر نیست
   ===================================================== */

document.title = CAFE_NAME ? "منو | " + CAFE_NAME : "منو";
document.getElementById("cafeName").textContent = CAFE_NAME;

var extra = location.search + location.hash;
var statusEl = document.getElementById("status");
var linksEl = document.getElementById("links");
var spinEl = document.getElementById("spin");
var redirected = false;
var CK = "menu_best_site";

function base(site) { return site.url.replace(/\/+$/, ""); }
function fullUrl(site) { return base(site) + "/" + extra; }

// دکمه‌های دستی
SITES.forEach(function (site) {
  var a = document.createElement("a");
  a.href = fullUrl(site);
  a.textContent = site.name;
  linksEl.appendChild(a);
});

function showManual() {
  if (redirected) return;
  linksEl.style.display = "block";
}
setTimeout(showManual, SHOW_MANUAL_AFTER);

function getCache() {
  if (!CACHE_MINUTES) return null;
  try {
    var o = JSON.parse(localStorage.getItem(CK) || "null");
    if (o && Date.now() - o.t < CACHE_MINUTES * 60000) {
      for (var i = 0; i < SITES.length; i++) if (SITES[i].url === o.u) return SITES[i];
    }
  } catch (e) {}
  return null;
}
function setCache(site) {
  if (!CACHE_MINUTES) return;
  try { localStorage.setItem(CK, JSON.stringify({ u: site.url, t: Date.now() })); } catch (e) {}
}

// اولین سایتی که جواب بده سریع‌ترینه؛ همون لحظه میره
function go(site) {
  if (redirected) return;
  redirected = true;
  setCache(site);
  statusEl.textContent = "وصل شد ✓ " + site.name;
  location.replace(fullUrl(site));
}

function fail() {
  if (redirected) return;
  spinEl.style.display = "none";
  statusEl.textContent = "اتصال خودکار برقرار نشد";
  showManual();
}

function probe(site, timeout, cb) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, timeout);
  fetch(base(site) + PING_PATH + "?_t=" + Date.now(), {
    method: "GET",
    mode: "no-cors",
    cache: "no-store",
    signal: ctrl.signal
  })
  .then(function () { clearTimeout(timer); cb(true); })
  .catch(function () { clearTimeout(timer); cb(false); });
}

function race() {
  var done = 0;
  SITES.forEach(function (site) {
    probe(site, TIMEOUT, function (ok) {
      done++;
      if (ok) go(site);
      else if (done === SITES.length) fail();
    });
  });
}

var cached = getCache();
if (cached) {
  probe(cached, CACHE_TIMEOUT, function (ok) { if (ok) go(cached); else race(); });
} else {
  race();
}
</script>
</body>
</html>
